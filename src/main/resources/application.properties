# ===== Aplicación =====
spring.application.name=workoutme
server.port=8080

# ===== Base de datos (MySQL) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/workoutme_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:workoutme}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ===== CORS =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ===== JWT =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120
